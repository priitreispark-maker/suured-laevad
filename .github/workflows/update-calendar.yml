name: Uuenda laevakalendrit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        run: python generate_calendar.py

      - name: Commit changes
        run: |
          git config user.name "Cruise Calendar Bot"
          git config user.email "actions@github.com"
          git add docs/suured-laevad.ics
          git diff --cached --quiet || git commit -m "Update cruise calendar"
          git push
